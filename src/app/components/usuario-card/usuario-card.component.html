<div class="card shadow-sm border-0 text-center p-3">
    <div>
        <img [src]="miUsuario.image" [alt]="miUsuario.first_name" class="rounded-circle mx-auto mb-3" style="width: 80px; height: 80px;">
    </div>
    <h3 class="h6 fw-bold">{{miUsuario.first_name}} {{miUsuario.last_name}}</h3>
    <p class="text-muted small">{{miUsuario.email}}</p>

    <app-botonera [parent]="'card'" [_id]="miUsuario._id"></app-botonera>
</div>
