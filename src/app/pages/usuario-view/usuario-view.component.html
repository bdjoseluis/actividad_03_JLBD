<section class="container mt-4">
    <div class="card shadow-lg p-4">
      <div class="row align-items-center">
        <figure class="col-12 col-md-4 text-center">
          <img
            class="img-fluid rounded-circle border border-3 border-primary"
            [src]="miUsuario.image"
            [alt]="miUsuario.first_name"
            style="width: 150px; height: 150px; object-fit: cover;"
          />
        </figure>
  
        <div class="col-12 col-md-8">
          <h3 class="fw-bold text-primary">
            {{ miUsuario.first_name }} {{ miUsuario.last_name }}
          </h3>
          <p class="text-muted fst-italic">Nombre de usuario: {{ miUsuario.username }}</p>
          <p>Email: <a [href]="'mailto:' + miUsuario.email" class="text-decoration-none text-dark">{{ miUsuario.email }}</a></p>
  
          <app-botonera [parent]="'view'" [_id]="miUsuario._id"></app-botonera>
        </div>
      </div>
    </div>
  </section>
